<!-- Lab 1 -->
<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <title>Опитування якості сервісу</title>
  </head>
  <body>
    <main>
      <h1>Опитування якості сервісу</h1>
      <form action="" method="POST">
         <fieldset>
          <legend>Інформація про відвідування</legend>
          <label for="fullname">ПІБ</label>
          <input id="fullname" name="fullname" type="text" minlength="3" required>
          <br><br>

          <label for="branch">Філія</label>
          <select id="branch" name="branch" required>
            <option value="">Оберіть філію: </option>
            <option value="central">Центральна філія</option>
            <option value="left-bank">Філія на лівому березі</option>
            <option value="right-bank">Філія на правому березі</option>
          </select>
         </fieldset>
        <fieldset>
         <legend>Оцінка сервісу</legend>
         <label for="rating">Оцінка від 1 до 10</label>
         <input id="rating" name="rating" type="range" min="1" max="10" value="5" required>
        </fieldset>

        <fieldset>
          <legend>Категорія проблем</legend>
          <label>
            <input type="checkbox" name="problems" value="staff">
            Персонал
          </label>

          <label>
            <input type="checkbox" name="problems" value="cleanliness">
            Чистота
          </label>
          
          <label>
            <input type="checkbox" name="problems" value="quality">
            Якість обслуговування
          </label>

          <label>
            <input type="checkbox" name="problems" value="other">
            Інше
          </label>
        </fieldset>
        <fieldset>
          <legend>Додаткова інформація </legend>

           <label for="comment">Коментар:</label>
           <br><br>
           <textarea id="comment" name="comment" rows="5" cols="40" required minlength="10"></textarea>
          <br><br>
          <label for="email">Email для зворотнього звʼязку</label>
          <input id="email" name="email" type="email">
        </fieldset>  
        <button type="sumbit">Надіслати</button>
      </form>
    </main>
</body>
</html>
