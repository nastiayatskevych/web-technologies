<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дашборд продажів</title>

<link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <h1>Дашборд продажів магазину</h1>

    <label for="category">Категорія товарів:</label>
    <select id="category">
      <option value="electronics">Електроніка</option>
      <option value="clothes">Одяг</option>
      <option value="books">Книги</option>
    </select>

    <section class="charts">
      <div class="chart-card">
        <h2>Продажі по місяцях</h2>
        <canvas id="barChart"></canvas>
      </div>

      <div class="chart-card">
        <h2>Порівняння 2024 та 2025</h2>
        <canvas id="lineChart"></canvas>
      </div>
    </section>
  </main>
</body>
</html>
